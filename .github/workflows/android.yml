name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install dependencies
        run: bun install

      - name: Build web assets
        run: bun run build

      - name: Setup Android Project
        run: |
          bun install @capacitor/core
          bun install -D @capacitor/cli @capacitor/android
          bunx cap init FLAME com.h2858.flame --web-dir dist
          bunx cap add android

      - name: Force Android app to launch in landscape
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          if 'android:screenOrientation="landscape"' not in text:
              text, count = re.subn(r'<activity\b', '<activity android:screenOrientation="landscape"', text, count=1)
              if count != 1:
                  raise SystemExit("Could not locate the Android launcher activity in AndroidManifest.xml")
              manifest.write_text(text)
          print("Launcher activity is locked to landscape.")
          PY

      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flame-game-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
